name: futuremode2026
description: "給長輩的口腔與認知訓練:健口操、快問快答、吃金幣。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 專案內的 local plugin:MediaPipe Face Landmarker 的 iOS 橋接
  face_mesh:
    path: packages/face_mesh

  # 專案內的 local plugin:ReplayKit 螢幕錄製
  screen_capture:
    path: packages/screen_capture

  record: ^6.2.1
  audioplayers: ^6.7.1
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  video_player: ^2.10.1
  sherpa_onnx: ^1.13.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # test/architecture_test.dart 用來正規化 import 路徑。
  path: ^1.9.0

flutter:
  uses-material-design: true

  # パタカラ 語音辨識用的 sherpa-onnx 德文串流 ASR 模型與熱詞,見 assets/asr/README.md。
  assets:
    - assets/asr/de/encoder.int8.onnx
    - assets/asr/de/decoder.onnx
    - assets/asr/de/joiner.onnx
    - assets/asr/de/tokens.txt
    - assets/asr/de/bpe.vocab
    - assets/asr/de/hotwords.txt
