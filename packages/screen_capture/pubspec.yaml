name: screen_capture
description: In-app screen recording backed by ReplayKit (iOS) and MediaProjection (Android).
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.9.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: tw.aarontsai.screen_capture
        pluginClass: ScreenCapturePlugin
      ios:
        pluginClass: ScreenCapturePlugin
