name: face_mesh
description: On-device face landmark / blendshape stream backed by MediaPipe Face Landmarker.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.9.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FaceMeshPlugin
